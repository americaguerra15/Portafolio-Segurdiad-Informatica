<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Simulador de Phishing</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
margin:0;
font-family:'Segoe UI',sans-serif;
background:#fdf2f8;
}

/* PANTALLAS */
.screen{
display:none;
height:100vh;
justify-content:center;
align-items:center;
flex-direction:column;
padding:20px;
text-align:center;
}

.active{display:flex;}

/* BOTONES */
.btn{
background:#ec4899;
color:white;
padding:14px 30px;
border:none;
border-radius:30px;
cursor:pointer;
margin-top:15px;
font-size:16px;
}

.btn:hover{
background:#db2777;
}

/* TARJETA */
.card{
background:white;
padding:25px;
border-radius:20px;
max-width:600px;
width:100%;
box-shadow:0 10px 30px rgba(0,0,0,0.1);
}

/* INPUT */
input{
width:100%;
padding:12px;
border-radius:20px;
border:1px solid #ccc;
margin-top:10px;
}

/* OPCIONES */
.opt{
border:2px solid #ec4899;
padding:12px;
border-radius:30px;
margin:10px;
cursor:pointer;
}

.opt:hover{
background:#fce7f3;
}

.correct{background:#bbf7d0;}
.wrong{background:#fecaca;}

</style>
</head>

<body>

<!-- 1. INICIO -->
<div id="inicio" class="screen active">
<h2>🛡️ Simulación de Phishing</h2>
<button class="btn" onclick="irConsentimiento()">Comenzar</button>
</div>

<!-- 2. CONSENTIMIENTO -->
<div id="consent" class="screen">
<div class="card">
<h3>⚠️ Consentimiento</h3>
<p>
Este quiz es una simulación educativa de phishing.<br>
No se recopilan datos reales ni credenciales.<br><br>
Tu desempeño será usado únicamente con fines académicos.
</p>

<input id="nombre" placeholder="Ingresa tu alias">

<button class="btn" onclick="iniciarQuiz()">Aceptar y continuar</button>
</div>
</div>

<!-- 3. QUIZ -->
<div id="quizScreen" class="screen">
<div class="card">

<h3 id="progreso"></h3>
<p id="pregunta"></p>

<div id="opciones"></div>

<p id="feedback"></p>

<button id="btnNext" class="btn" onclick="siguiente()" disabled>Siguiente</button>

</div>
</div>

<!-- 4. RESULTADOS -->
<div id="resultadoScreen" class="screen">
<div class="card">

<h2>🏆 Resultado</h2>
<h1 id="score"></h1>
<p id="tiempo"></p>
<p id="nivel"></p>
<p id="posicion"></p>

<h3>🏆 Ranking</h3>
<div id="ranking"></div>

<button class="btn" onclick="location.reload()">🔄 Volver a jugar</button>

</div>
</div>

<script>

// ================= ESCENARIOS (10 reales) =================
let preguntas = [

{t:`📧 Banco Santander
De: seguridad@bancosantander-verify.net
Asunto: Bloqueo urgente

Detectamos actividad sospechosa. 
Ingrese aquí para reactivar su cuenta:
http://bancosantander-verificacion.com`,
c:"phishing",
e:"Dominio falso + urgencia. El banco nunca usa enlaces externos."},

{t:`📧 Google
Accede en: https://accounts.google.com`,
c:"legit",
e:"Dominio oficial de Google."},

{t:`📱 SMS
Tu paquete está retenido. Paga aquí: bit.ly/3abc`,
c:"phishing",
e:"Uso de URL acortada para ocultar destino."},

{t:`📧 Netflix
Tu cuenta será suspendida. Verifica aquí:
http://netflix-secure-login.xyz`,
c:"phishing",
e:"Dominio falso y urgencia."},

{t:`📧 Amazon
Consulta tu pedido en:
https://amazon.com`,
c:"legit",
e:"Dominio oficial sin presión."},

{t:`📧 TI
Necesitamos tu contraseña para mantenimiento.`,
c:"phishing",
e:"Nunca se solicitan contraseñas."},

{t:`📧 PayPal
Inicia sesión en:
paypal-security-check.com`,
c:"phishing",
e:"Dominio incorrecto."},

{t:`📧 Microsoft
Actividad sospechosa detectada
https://login.microsoft.com`,
c:"legit",
e:"Dominio válido."},

{t:`📧 Documento adjunto
Archivo: factura.exe`,
c:"phishing",
e:"Archivo ejecutable peligroso."},

{t:`📧 BBVA
Accede a tu banca:
https://www.bbva.mx`,
c:"legit",
e:"Dominio correcto y seguro."}

];

// ================= VARIABLES =================
let i=0;
let score=0;
let nombre="";
let inicio;
let respondido=false;

// ================= FLUJO =================
function irConsentimiento(){
document.getElementById("inicio").classList.remove("active");
document.getElementById("consent").classList.add("active");
}

function iniciarQuiz(){
nombre=document.getElementById("nombre").value || "Anon";

document.getElementById("consent").classList.remove("active");
document.getElementById("quizScreen").classList.add("active");

inicio=Date.now();
mostrar();
}

// ================= MOSTRAR =================
function mostrar(){

respondido=false;

let p=preguntas[i];

document.getElementById("progreso").innerText=`Pregunta ${i+1}/10`;
document.getElementById("pregunta").innerText=p.t;
document.getElementById("feedback").innerText="";

document.getElementById("opciones").innerHTML=`
<div class="opt" onclick="responder('phishing',this)">🔴 Phishing</div>
<div class="opt" onclick="responder('legit',this)">🟢 Legítimo</div>
`;

document.getElementById("btnNext").disabled=true;
}

// ================= RESPONDER =================
function responder(r,btn){

if(respondido) return;
respondido=true;

let p=preguntas[i];

if(r===p.c){
score+=10;
btn.classList.add("correct");
document.getElementById("feedback").innerText="✅ Correcto: "+p.e;
}else{
btn.classList.add("wrong");
document.getElementById("feedback").innerText="❌ Incorrecto: "+p.e;
}

document.getElementById("btnNext").disabled=false;
}

// ================= SIGUIENTE =================
function siguiente(){
i++;
if(i<preguntas.length){
mostrar();
}else{
fin();
}
}

// ================= RESULTADO =================
function fin(){

document.getElementById("quizScreen").classList.remove("active");
document.getElementById("resultadoScreen").classList.add("active");

let tiempo=((Date.now()-inicio)/1000).toFixed(2);

document.getElementById("score").innerText=score+"/100";
document.getElementById("tiempo").innerText="⏱️ Tiempo: "+tiempo+" s";

let nivel="";
if(score<50) nivel="🚨 Alto riesgo";
else if(score<80) nivel="⚠️ Riesgo medio";
else nivel="🟢 Buen nivel";

document.getElementById("nivel").innerText=nivel;

// ranking
let data=JSON.parse(localStorage.getItem("ranking"))||[];
data.push({nombre,score});
data.sort((a,b)=>b.score-a.score);
localStorage.setItem("ranking",JSON.stringify(data));

// posición
let pos=data.findIndex(p=>p.nombre===nombre && p.score===score)+1;
document.getElementById("posicion").innerText="🏅 Posición: "+pos;

// mostrar ranking
let html="";
data.slice(0,5).forEach((p,i)=>{
html+=`${i+1}. ${p.nombre} - ${p.score}<br>`;
});

document.getElementById("ranking").innerHTML=html;
}

</script>

</body>
</html>
