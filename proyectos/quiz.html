<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Phishing Quiz Pro</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
margin:0;
font-family:'Segoe UI',sans-serif;
background:linear-gradient(135deg,#ffe4ec,#e0f2fe);
}

.screen{
display:none;
height:100vh;
justify-content:center;
align-items:center;
flex-direction:column;
text-align:center;
padding:20px;
}

.active{display:flex;}

input{
padding:15px;
width:300px;
border-radius:30px;
border:2px solid #f472b6;
}

.btn{
margin-top:20px;
padding:15px 30px;
border:none;
border-radius:30px;
background:linear-gradient(135deg,#ec4899,#f43f5e);
color:white;
font-size:18px;
cursor:pointer;
}

.quiz-card{
background:white;
padding:25px;
border-radius:20px;
width:90%;
max-width:600px;
box-shadow:0 15px 30px rgba(0,0,0,0.2);
}

.opt{
padding:15px;
border-radius:30px;
border:2px solid #f472b6;
margin:10px;
cursor:pointer;
}

.result{
font-size:50px;
color:#ec4899;
font-weight:bold;
}

.chart{
width:300px;
margin:20px auto;
}
</style>
</head>

<body>

<!-- INICIO -->
<div id="start" class="screen active">
<h2>🎭 Elige tu alias</h2>
<input id="nombre" placeholder="Ej: Explorador">
<button class="btn" onclick="iniciar()">▶ Comenzar</button>
</div>

<!-- QUIZ -->
<div id="quizScreen" class="screen">
<div class="quiz-card">
<h3 id="alias"></h3>
<p id="pregunta"></p>

<div class="opt" onclick="responder('phishing')">🔴 Phishing</div>
<div class="opt" onclick="responder('legit')">🟢 Legítimo</div>

<p id="feedback"></p>

<button class="btn" onclick="siguiente()">Siguiente</button>
</div>
</div>

<!-- RESULTADOS -->
<div id="resultScreen" class="screen">
<h2>🏆 Resultado</h2>

<div class="result" id="score"></div>
<p id="nivel"></p>
<p id="tiempo"></p>

<canvas id="chartAciertos" class="chart"></canvas>
<canvas id="chartTiempo" class="chart"></canvas>

<h3>🏆 Ranking</h3>
<div id="ranking"></div>

<button class="btn" onclick="reiniciar()">🔄 Volver a jugar</button>
</div>

<script>

// LIMPIAR ranking al cargar (IMPORTANTE)
localStorage.removeItem("ranking");

// preguntas
let preguntas = [
{t:"Banco falso verify.net",c:"phishing"},
{t:"https://accounts.google.com",c:"legit"},
{t:"SMS bit.ly",c:"phishing"},
{t:"TI pide contraseña",c:"phishing"},
{t:"Amazon oficial",c:"legit"}
];

let i=0;
let score=0;
let nombre="";
let tiempos=[];
let inicio;

// iniciar
function iniciar(){
nombre=document.getElementById("nombre").value||"Anon";

document.getElementById("start").classList.remove("active");
document.getElementById("quizScreen").classList.add("active");

document.getElementById("alias").innerText=nombre;

inicio=Date.now();
mostrar();
}

// mostrar pregunta
function mostrar(){
document.getElementById("pregunta").innerText=preguntas[i].t;
}

// responder
function responder(r){
let tiempo=(Date.now()-inicio)/1000;
tiempos.push(tiempo);
inicio=Date.now();

if(r===preguntas[i].c){
score+=20;
document.getElementById("feedback").innerText="✅ Correcto";
}else{
document.getElementById("feedback").innerText="❌ Incorrecto";
}
}

// siguiente
function siguiente(){
i++;
if(i<preguntas.length){
mostrar();
}else{
fin();
}
}

// fin
function fin(){

document.getElementById("quizScreen").classList.remove("active");
document.getElementById("resultScreen").classList.add("active");

let totalTiempo=(tiempos.reduce((a,b)=>a+b,0)).toFixed(2);

document.getElementById("score").innerText=score+"/100";

let nivel="";
if(score<50) nivel="🚨 Alto riesgo";
else if(score<80) nivel="⚠️ Medio";
else nivel="🟢 Seguro";

document.getElementById("nivel").innerText=nivel;
document.getElementById("tiempo").innerText="⏱️ "+totalTiempo+" s";

// guardar ranking
let data=[];
data.push({nombre,score});
localStorage.setItem("ranking",JSON.stringify(data));

// mostrar ranking
document.getElementById("ranking").innerHTML=
`1. ${nombre} - ${score}`;

// ===== GRÁFICA ACIERTOS =====
new Chart(document.getElementById("chartAciertos"),{
type:"bar",
data:{
labels:["1","2","3","4","5"],
datasets:[{
label:"Aciertos",
data:preguntas.map((_,idx)=> (idx<score/20?100:0))
}]
}
});

// ===== GRÁFICA TIEMPO =====
new Chart(document.getElementById("chartTiempo"),{
type:"line",
data:{
labels:["1","2","3","4","5"],
datasets:[{
label:"Tiempo",
data:tiempos
}]
}
});
}

// reiniciar
function reiniciar(){
location.reload();
}

</script>

</body>
</html>
