<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Phishing Quiz</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
font-family: 'Segoe UI', sans-serif;
background:#f1f5f9;
margin:0;
padding:0;
}

.container{
max-width:700px;
margin:auto;
padding:30px;
}

.card{
background:white;
padding:25px;
border-radius:15px;
box-shadow:0 10px 25px rgba(0,0,0,0.1);
}

h1{
text-align:center;
}

input{
padding:10px;
width:100%;
margin-bottom:15px;
border-radius:8px;
border:1px solid #ccc;
}

button{
padding:10px 15px;
border:none;
border-radius:8px;
cursor:pointer;
margin:5px;
}

.btn{
background:#2563eb;
color:white;
}

.btn:hover{
background:#1d4ed8;
}

.feedback{
margin-top:10px;
font-weight:bold;
}

.top{
text-align:center;
margin-bottom:20px;
}

.ranking{
margin-top:20px;
background:#f8fafc;
padding:15px;
border-radius:10px;
}

.back{
margin-top:20px;
display:block;
text-align:center;
text-decoration:none;
color:#2563eb;
}
</style>

</head>

<body>

<div class="container">

<div class="card">

<div class="top">
<h1>🛡️ Simulador de Phishing</h1>
<p><b>América Fabiola Guerra Ramírez</b><br>
Seguridad Informática | 8° semestre</p>
</div>

<input type="text" id="nombre" placeholder="Ingresa tu nombre">

<div id="quiz"></div>

<button class="btn" onclick="siguiente()">Siguiente</button>

<h3 id="resultado"></h3>

<div class="ranking" id="ranking"></div>

<a href="PR02.html" class="back">⬅ Regresar</a>

</div>
</div>

<script>

let preguntas = [
{t:"Netflix: Verifica aquí http://netflix-verifica.xyz", c:"phishing", e:"Dominio falso"},
{t:"Banco: https://bbva.com", c:"legit", e:"Dominio oficial"},
{t:"SMS: paquete retenido bit.ly", c:"phishing", e:"URL acortada"},
{t:"TI pide contraseña", c:"phishing", e:"Nunca pedirán contraseña"},
{t:"Amazon factura oficial", c:"legit", e:"Sin engaño"},
{t:"Ganaste premio urgente", c:"phishing", e:"Urgencia falsa"},
{t:"PayPal-login-secure.com", c:"phishing", e:"Dominio falso"},
{t:"Google accounts.google.com", c:"legit", e:"Seguro"},
{t:"Archivo .exe", c:"phishing", e:"Archivo peligroso"},
{t:"Microsoft oficial", c:"legit", e:"Dominio correcto"}
];

let i=0;
let score=0;

function mostrar(){
let p=preguntas[i];

document.getElementById("quiz").innerHTML=`
<p><b>Pregunta ${i+1}/10</b></p>
<p>${p.t}</p>

<button onclick="resp('phishing')">Phishing</button>
<button onclick="resp('legit')">Legítimo</button>

<p class="feedback" id="f"></p>
`;
}

function resp(r){
let p=preguntas[i];

if(r===p.c){
score+=10;
document.getElementById("f").innerHTML="✅ Correcto: "+p.e;
}else{
document.getElementById("f").innerHTML="❌ Incorrecto: "+p.e;
}
}

function siguiente(){
i++;
if(i<preguntas.length){
mostrar();
}else{
fin();
}
}

function fin(){

let nombre=document.getElementById("nombre").value || "Anónimo";

let nivel="";
if(score<=40) nivel="Alto riesgo";
else if(score<=70) nivel="Riesgo medio";
else nivel="Buen nivel";

document.getElementById("quiz").innerHTML="";
document.getElementById("resultado").innerHTML=
`🎯 ${nombre}<br>Puntaje: ${score}<br>${nivel}`;

guardarRanking(nombre,score);
mostrarRanking();
}

function guardarRanking(nombre,score){
let data=JSON.parse(localStorage.getItem("ranking"))||[];
data.push({nombre,score});
data.sort((a,b)=>b.score-a.score);
localStorage.setItem("ranking",JSON.stringify(data));
}

function mostrarRanking(){
let data=JSON.parse(localStorage.getItem("ranking"))||[];

let html="<h3>🏆 Ranking</h3>";

data.slice(0,5).forEach((p,i)=>{
html+=`${i+1}. ${p.nombre} - ${p.score}<br>`;
});

document.getElementById("ranking").innerHTML=html;
}

mostrar();
mostrarRanking();

</script>

</body>
</html>
