<hr style="margin:40px 0">

<h2>🛡️ Simulador de Phishing Interactivo</h2>
<p>Analiza cada mensaje como si fuera real. ¿Caerías o no?</p>

<div id="quizContainer"></div>

<br>
<button onclick="siguientePregunta()" id="btnNext">Siguiente</button>

<h3 id="resultado"></h3>

<script>

let preguntas = [
{
texto: "📧 Netflix: Tu cuenta será suspendida. Ingresa aquí: http://netflix-verifica.xyz",
correcta: "phishing",
explicacion: "Dominio falso y urgencia → típico phishing."
},
{
texto: "📧 Banco BBVA: Verifica tu cuenta en https://bbva.com",
correcta: "legit",
explicacion: "Dominio oficial y sin urgencia sospechosa."
},
{
texto: "📱 SMS: Paquete retenido. Paga aquí: bit.ly/3abc",
correcta: "phishing",
explicacion: "URL acortada → oculta destino real."
},
{
texto: "📧 TI: Necesitamos tu contraseña para mantenimiento",
correcta: "phishing",
explicacion: "NUNCA te pedirán contraseñas."
},
{
texto: "📧 Amazon: Factura disponible en tu cuenta oficial",
correcta: "legit",
explicacion: "No pide datos ni enlaces sospechosos."
},
{
texto: "📧 Premio ganado! Da clic ya o lo pierdes",
correcta: "phishing",
explicacion: "Urgencia + premio falso."
},
{
texto: "📧 PayPal: Inicia sesión en paypal-secure-login.com",
correcta: "phishing",
explicacion: "Dominio falso (no es paypal.com)."
},
{
texto: "📧 Microsoft: Actividad sospechosa detectada (login.microsoft.com)",
correcta: "legit",
explicacion: "Dominio oficial."
},
{
texto: "📧 Archivo urgente adjunto (.exe)",
correcta: "phishing",
explicacion: "Archivos ejecutables = peligro."
},
{
texto: "📧 Google: Nueva política (accounts.google.com)",
correcta: "legit",
explicacion: "Dominio correcto."
}
];

let actual = 0;
let score = 0;

function mostrarPregunta(){
let p = preguntas[actual];

document.getElementById("quizContainer").innerHTML = `
<div style="border:1px solid #ccc; padding:15px; border-radius:10px;">
<p><b>Pregunta ${actual+1} de 10</b></p>
<p>${p.texto}</p>

<button onclick="responder('phishing')">Phishing</button>
<button onclick="responder('legit')">Legítimo</button>

<p id="feedback"></p>
</div>
`;
}

function responder(resp){
let p = preguntas[actual];
let feedback = document.getElementById("feedback");

if(resp === p.correcta){
score += 10;
feedback.innerHTML = "✅ Correcto: " + p.explicacion;
feedback.style.color = "green";
}else{
feedback.innerHTML = "❌ Incorrecto: " + p.explicacion;
feedback.style.color = "red";
}
}

function siguientePregunta(){
actual++;

if(actual < preguntas.length){
mostrarPregunta();
}else{
mostrarResultado();
}
}

function mostrarResultado(){

let nivel = "";

if(score <= 40){
nivel = "🚨 Alto riesgo";
}
else if(score <= 70){
nivel = "⚠️ Riesgo medio";
}
else{
nivel = "🟢 Buen nivel";
}

document.getElementById("quizContainer").innerHTML = "";
document.getElementById("btnNext").style.display = "none";

document.getElementById("resultado").innerHTML =
`🎯 Puntaje: ${score}/100 <br> Nivel: ${nivel}
<br><br> 💡 Recomendación:
Nunca hagas clic en enlaces sospechosos ni compartas contraseñas.`;
}

mostrarPregunta();

</script>
