<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Simulador de Phishing</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
font-family: 'Segoe UI', sans-serif;
background: linear-gradient(135deg,#fce7f3,#e0f2fe);
margin:0;
}

.container{
max-width:800px;
margin:auto;
padding:30px;
}

.card{
background:white;
padding:30px;
border-radius:20px;
box-shadow:0 20px 40px rgba(0,0,0,0.15);
border-top:5px solid #ec4899;
}

h1{
text-align:center;
}

input{
width:100%;
padding:12px;
border-radius:10px;
border:1px solid #ccc;
margin-bottom:15px;
}

button{
padding:12px 20px;
border:none;
border-radius:999px;
cursor:pointer;
font-weight:bold;
margin:5px;
background:#ec4899;
color:white;
}

button:hover{
transform:scale(1.05);
}

#barra{
height:10px;
background:#e5e7eb;
border-radius:10px;
overflow:hidden;
margin-bottom:20px;
}

#progreso{
height:100%;
width:0%;
background:#ec4899;
}

.ranking{
background:#f8fafc;
padding:15px;
border-radius:10px;
margin-top:20px;
}

.back{
display:block;
text-align:center;
margin-top:20px;
color:#2563eb;
text-decoration:none;
}
</style>
</head>

<body>

<div class="container">
<div class="card">

<h1>🛡️ Simulador de Phishing</h1>
<p style="text-align:center;">
América Fabiola Guerra Ramírez<br>
Seguridad Informática | 8° semestre
</p>

<!-- INPUT DEL NOMBRE -->
<input type="text" id="nombre" placeholder="Ingresa tu alias para el ranking">

<!-- BARRA DE PROGRESO -->
<div id="barra">
<div id="progreso"></div>
</div>

<!-- QUIZ -->
<div id="quiz"></div>

<button id="btnNext" onclick="siguiente()">Siguiente</button>

<h3 id="resultado"></h3>

<div id="ranking" class="ranking"></div>

<button onclick="reiniciar()">🔄 Volver a jugar</button>

<a href="PR02.html" class="back">⬅ Regresar</a>

</div>
</div>

<script>

// =======================
// VARIABLES GLOBALES
// =======================

// Lista de preguntas con:
// t = texto
// c = respuesta correcta
// e = explicación
let preguntas = [
{t:"Netflix: http://netflix-verifica.xyz", c:"phishing", e:"Dominio falso"},
{t:"Banco: https://bbva.com", c:"legit", e:"Dominio oficial"},
{t:"SMS: bit.ly enlace", c:"phishing", e:"URL acortada"},
{t:"TI pide contraseña", c:"phishing", e:"Nunca piden contraseña"},
{t:"Amazon factura", c:"legit", e:"Mensaje legítimo"},
{t:"Premio urgente", c:"phishing", e:"Urgencia sospechosa"},
{t:"PayPal-login-secure.com", c:"phishing", e:"Dominio falso"},
{t:"Google accounts.google.com", c:"legit", e:"Seguro"},
{t:"Archivo .exe", c:"phishing", e:"Archivo peligroso"},
{t:"Microsoft oficial", c:"legit", e:"Dominio correcto"}
];

// índice de pregunta actual
let i = 0;

// puntaje del usuario
let score = 0;

// arreglo para guardar tiempos por pregunta
let tiempos = [];

// tiempo inicial
let inicioTiempo = Date.now();


// =======================
// FUNCIÓN: mostrar()
// Muestra la pregunta actual en pantalla
// =======================
function mostrar(){

let p = preguntas[i];

document.getElementById("quiz").innerHTML = `
<p><b>Pregunta ${i+1}/10</b></p>
<p style="font-size:18px;">${p.t}</p>

<button onclick="responder('phishing')">🔴 Phishing</button>
<button onclick="responder('legit')">🟢 Legítimo</button>

<p id="feedback"></p>
`;

// actualiza barra de progreso
actualizarBarra();
}


// =======================
// FUNCIÓN: responder()
// Evalúa la respuesta del usuario
// Guarda tiempo y muestra feedback
// =======================
function responder(r){

let p = preguntas[i];

// calcular tiempo que tardó
let tiempo = (Date.now() - inicioTiempo)/1000;
tiempos.push(tiempo);
inicioTiempo = Date.now();

// verificar respuesta
if(r === p.c){
score += 10;
document.getElementById("feedback").innerHTML = "✅ Correcto: "+p.e;
}else{
document.getElementById("feedback").innerHTML = "❌ Incorrecto: "+p.e;
}
}


// =======================
// FUNCIÓN: siguiente()
// Pasa a la siguiente pregunta
// =======================
function siguiente(){

i++;

if(i < preguntas.length){
mostrar();
}else{
fin();
}
}


// =======================
// FUNCIÓN: fin()
// Calcula resultados finales
// Guarda ranking
// =======================
function fin(){

let nombre = document.getElementById("nombre").value.trim();

// evitar guardar sin nombre
if(nombre === ""){
nombre = "Anónimo";
}

// calcular promedio de tiempo
let promedio = tiempos.reduce((a,b)=>a+b,0)/tiempos.length;

// nivel de riesgo
let nivel = "";
if(score <= 40) nivel = "🚨 Alto riesgo";
else if(score <= 70) nivel = "⚠️ Riesgo medio";
else nivel = "🟢 Buen nivel";

// mostrar resultado
document.getElementById("quiz").innerHTML = "";
document.getElementById("btnNext").style.display = "none";

document.getElementById("resultado").innerHTML =
`🎯 ${nombre}<br>
Puntaje: ${score}/100<br>
${nivel}<br>
⏱️ Tiempo promedio: ${promedio.toFixed(2)} s`;

// guardar en ranking
guardarRanking(nombre, score);

// mostrar ranking
mostrarRanking();
}


// =======================
// FUNCIÓN: guardarRanking()
// Guarda datos en localStorage
// Evita duplicados consecutivos
// =======================
function guardarRanking(nombre, score){

let data = JSON.parse(localStorage.getItem("ranking")) || [];

let ultimo = data[data.length - 1];

// evita guardar duplicado inmediato
if(ultimo && ultimo.nombre === nombre && ultimo.score === score){
return;
}

data.push({nombre, score});

// ordenar por mayor puntaje
data.sort((a,b)=>b.score-a.score);

localStorage.setItem("ranking", JSON.stringify(data));
}


// =======================
// FUNCIÓN: mostrarRanking()
// Muestra top 5 del ranking
// =======================
function mostrarRanking(){

let data = JSON.parse(localStorage.getItem("ranking")) || [];

let html = "<h3>🏆 Ranking</h3>";

data.slice(0,5).forEach((p, index)=>{
html += `${index+1}. ${p.nombre} - ${p.score}<br>`;
});

document.getElementById("ranking").innerHTML = html;
}


// =======================
// FUNCIÓN: actualizarBarra()
// Actualiza barra de progreso
// =======================
function actualizarBarra(){

let porcentaje = (i / preguntas.length) * 100;

document.getElementById("progreso").style.width = porcentaje + "%";
}


// =======================
// FUNCIÓN: reiniciar()
// Reinicia TODO el quiz
// =======================
function reiniciar(){

i = 0;
score = 0;
tiempos = [];
inicioTiempo = Date.now();

document.getElementById("nombre").value = "";
document.getElementById("resultado").innerHTML = "";

document.getElementById("btnNext").style.display = "inline-block";

mostrar();
}


// iniciar quiz
mostrar();
mostrarRanking();

</script>

</body>
</html>
