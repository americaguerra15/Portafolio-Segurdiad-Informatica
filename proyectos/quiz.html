<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Simulación de Phishing</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
margin:0;
font-family:'Segoe UI',sans-serif;
background:#f8fafc;
color:#1e293b;
}

/* PANTALLAS */
.screen{
display:none;
height:100vh;
justify-content:center;
align-items:center;
flex-direction:column;
padding:20px;
text-align:center;
}

.active{display:flex;}

/* TARJETAS */
.card{
background:white;
padding:30px;
border-radius:18px;
max-width:650px;
width:100%;
box-shadow:0 10px 30px rgba(0,0,0,0.08);
border:1px solid #e2e8f0;
}

/* BOTONES */
.btn{
background:#334155;
color:white;
padding:12px 28px;
border:none;
border-radius:12px;
cursor:pointer;
margin-top:15px;
font-size:15px;
transition:0.2s;
}

.btn:hover{
background:#1e293b;
}

/* INPUT */
input{
width:100%;
padding:12px;
border-radius:12px;
border:1px solid #cbd5e1;
margin-top:10px;
}

/* OPCIONES */
.opt{
border:1px solid #cbd5e1;
padding:12px;
border-radius:12px;
margin:10px;
cursor:pointer;
transition:0.2s;
}

.opt:hover{
background:#f1f5f9;
}

.correct{
background:#dcfce7;
border-color:#22c55e;
}

.wrong{
background:#fee2e2;
border-color:#ef4444;
}

/* BOTÓN REGRESAR */
.back{
position:absolute;
top:20px;
left:20px;
text-decoration:none;
color:#334155;
font-weight:bold;
}
</style>
</head>

<body>

<a href="PR02.html" class="back">⬅ Regresar</a>

<!-- CONSENTIMIENTO -->
<div id="consent" class="screen active">
<div class="card">

<h2>🛡️ Simulación de Phishing</h2>

<p style="color:#64748b;">
Simulación educativa de ingeniería social basada en escenarios reales.
</p>

<p>
No se recopilan datos sensibles.  
Este ejercicio es únicamente académico.
</p>

<input id="nombre" placeholder="Ingresa tu alias">

<button class="btn" onclick="iniciarQuiz()">Aceptar y comenzar</button>

</div>
</div>

<!-- QUIZ -->
<div id="quizScreen" class="screen">
<div class="card">

<h3 id="progreso"></h3>
<p id="pregunta" style="white-space:pre-line;"></p>

<div id="opciones"></div>

<p id="feedback"></p>

<button id="btnNext" class="btn" onclick="siguiente()" disabled>Siguiente</button>

</div>
</div>

<!-- RESULTADO -->
<div id="resultadoScreen" class="screen">
<div class="card">

<h2>🏆 Resultado</h2>

<h1 id="score"></h1>
<p id="tiempo"></p>
<p id="nivel"></p>
<p id="posicion"></p>

<h3>🏆 Ranking</h3>
<div id="ranking"></div>

<button class="btn" onclick="location.reload()">🔄 Volver a jugar</button>

<a href="PR02.html" class="btn">⬅ Volver al proyecto</a>

</div>
</div>

<script>

// ===== ESCENARIOS =====
let preguntas = [

{
t:`📧 Banco Santander

De: Seguridad Santander <seguridad@bancosantander-verify.net>
Asunto: ⚠️ Bloqueo temporal de su cuenta

Estimado cliente:

Hemos detectado múltiples intentos de acceso no autorizados en su cuenta bancaria.
Por motivos de seguridad, su cuenta ha sido temporalmente suspendida.

Para evitar el bloqueo permanente, le solicitamos verificar su identidad en el siguiente enlace:

http://bancosantander-verificacion.com

Si no completa este proceso en las próximas 24 horas, su cuenta será desactivada definitivamente.

Atentamente,
Equipo de Seguridad Santander`,
c:"phishing",
e:"El dominio no es oficial y usa urgencia para presionar al usuario."
},

{
t:`📧 Google

De: Google Security <no-reply@accounts.google.com>
Asunto: Nuevo inicio de sesión detectado

Hola,

Hemos detectado un inicio de sesión en tu cuenta desde un dispositivo nuevo.
Si fuiste tú, no necesitas hacer nada.

Puedes revisar la actividad reciente en el siguiente enlace:
https://accounts.google.com/security

Gracias por ayudar a mantener segura tu cuenta.

Equipo de Google`,
c:"legit",
e:"El dominio es oficial y no solicita información sensible."
},

{
t:`📱 SMS - Servicio de paquetería

Estimado usuario,

Tu paquete no pudo ser entregado debido a un problema con la dirección.
Para reprogramar la entrega, accede al siguiente enlace:

http://bit.ly/entrega-paquete-123

Si no confirmas en las próximas horas, el paquete será devuelto.

Gracias por tu preferencia.`,
c:"phishing",
e:"Uso de enlace acortado y presión de tiempo."
},

{
t:`📧 Netflix

De: soporte@netflix-secure.xyz
Asunto: Problema con tu suscripción

Hola,

No pudimos procesar el pago de tu suscripción mensual.
Para evitar la cancelación del servicio, actualiza tu método de pago aquí:

http://netflix-login-secure.xyz

Tu cuenta será suspendida en 24 horas si no realizas la verificación.

Netflix`,
c:"phishing",
e:"Dominio falso y lenguaje de urgencia."
},

{
t:`📧 Amazon

De: auto-confirm@amazon.com
Asunto: Confirmación de envío

Hola,

Tu pedido ha sido enviado correctamente y llegará en los próximos días.

Puedes revisar los detalles de tu pedido y el estado de envío en:
https://www.amazon.com/orders

Gracias por comprar con nosotros.

Amazon`,
c:"legit",
e:"Dominio legítimo y sin presión ni solicitud de datos."
},

{
t:`📧 Departamento de TI

De: soporte-ti@empresa.com
Asunto: Actualización de sistema

Estimado colaborador,

Estamos realizando una actualización del sistema corporativo.
Para completar el proceso, necesitamos que nos proporciones tu usuario y contraseña.

Por favor responde a este correo con tus credenciales.

Atentamente,
Departamento de TI`,
c:"phishing",
e:"Ningún departamento solicita contraseñas por correo."
},

{
t:`📧 PayPal

De: soporte@paypal-verificacion.com
Asunto: Actividad inusual en tu cuenta

Estimado cliente,

Detectamos actividad sospechosa en tu cuenta PayPal.
Para evitar restricciones, inicia sesión y verifica tu información:

http://paypal-verificacion-segura.com

Gracias por tu cooperación.

PayPal`,
c:"phishing",
e:"El dominio no es paypal.com."
},

{
t:`📧 Microsoft

De: account-security@microsoft.com
Asunto: Inicio de sesión inusual

Hola,

Detectamos un intento de acceso desde una ubicación desconocida.
Si no reconoces esta actividad, revisa tu cuenta aquí:

https://login.microsoft.com/security

No es necesario realizar ninguna acción si reconoces el acceso.

Microsoft`,
c:"legit",
e:"Dominio oficial y mensaje informativo."
},

{
t:`📧 Factura adjunta

De: facturacion@proveedor.com
Asunto: Factura pendiente

Buen día,

Adjuntamos la factura correspondiente a su último pedido.
Por favor revise el archivo adjunto y confirme su recepción.

Archivo: factura.exe

Saludos.`,
c:"phishing",
e:"Los archivos .exe pueden ejecutar malware."
},

{
t:`📧 BBVA

De: notificaciones@bbva.mx
Asunto: Estado de cuenta disponible

Estimado cliente,

Su estado de cuenta mensual ya está disponible.
Puede consultarlo de manera segura en el siguiente enlace:

https://www.bbva.mx

Gracias por confiar en BBVA.`,
c:"legit",
e:"Dominio oficial y comunicación informativa."
}

];
let i=0;
let score=0;
let nombre="";
let inicio;
let respondido=false;

// ===== INICIAR =====
function iniciarQuiz(){

nombre=document.getElementById("nombre").value || "Anon";

document.getElementById("consent").classList.remove("active");
document.getElementById("quizScreen").classList.add("active");

inicio=Date.now();

mostrar();
}

// ===== MOSTRAR =====
function mostrar(){

respondido=false;

let p=preguntas[i];

document.getElementById("progreso").innerText=`Pregunta ${i+1}/10`;
document.getElementById("pregunta").innerText=p.t;
document.getElementById("feedback").innerText="";

document.getElementById("opciones").innerHTML=`
<div class="opt" onclick="responder('phishing',this)">🔴 Phishing</div>
<div class="opt" onclick="responder('legit',this)">🟢 Legítimo</div>
`;

document.getElementById("btnNext").disabled=true;
}

// ===== RESPONDER =====
function responder(r,btn){

if(respondido) return;
respondido=true;

let p=preguntas[i];

if(r===p.c){
score+=10;
btn.classList.add("correct");
document.getElementById("feedback").innerText="✅ Correcto: "+p.e;
}else{
btn.classList.add("wrong");
document.getElementById("feedback").innerText="❌ Incorrecto: "+p.e;
}

document.getElementById("btnNext").disabled=false;
}

// ===== SIGUIENTE =====
function siguiente(){
i++;
if(i<preguntas.length){
mostrar();
}else{
fin();
}
}

// ===== RESULTADO =====
function fin(){

document.getElementById("quizScreen").classList.remove("active");
document.getElementById("resultadoScreen").classList.add("active");

let tiempo=((Date.now()-inicio)/1000).toFixed(2);

document.getElementById("score").innerText=score+"/100";
document.getElementById("tiempo").innerText="⏱️ "+tiempo+" s";

let nivel="";
if(score<50) nivel="🚨 Alto riesgo";
else if(score<80) nivel="⚠️ Riesgo medio";
else nivel="🟢 Buen nivel";

document.getElementById("nivel").innerText=nivel;

// ranking
let data=JSON.parse(localStorage.getItem("ranking"))||[];
data.push({
nombre,
score,
tiempo: parseFloat(tiempo)
});
data.sort((a,b)=>{
if(b.score !== a.score){
return b.score - a.score; // mayor puntaje primero
}
return a.tiempo - b.tiempo; // menor tiempo gana
});
localStorage.setItem("ranking",JSON.stringify(data));

// posición
let pos = data.findIndex(p =>
p.nombre === nombre &&
p.score === score &&
p.tiempo === parseFloat(tiempo)
) + 1;
document.getElementById("posicion").innerText="🏅 Posición: "+pos;

// mostrar ranking
let html = `
<table style="width:100%; border-collapse:collapse; margin-top:10px;">
<tr style="background:#f1f5f9;">
<th style="padding:8px;border:1px solid #e2e8f0;">Pos</th>
<th style="padding:8px;border:1px solid #e2e8f0;">Nombre</th>
<th style="padding:8px;border:1px solid #e2e8f0;">Puntaje</th>
<th style="padding:8px;border:1px solid #e2e8f0;">Tiempo</th>
</tr>
`;

data.slice(0,5).forEach((p,i)=>{
html += `
<tr>
<td style="padding:8px;border:1px solid #e2e8f0;">${i+1}</td>
<td style="padding:8px;border:1px solid #e2e8f0;">${p.nombre}</td>
<td style="padding:8px;border:1px solid #e2e8f0;">${p.score}</td>
<td style="padding:8px;border:1px solid #e2e8f0;">${p.tiempo}s</td>
</tr>
`;
});

html += `</table>`;

document.getElementById("ranking").innerHTML=html;
}

</script>

</body>
</html>
